apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-api
  namespace: fcapsule-lab
  labels:
    app.kubernetes.io/name: inventory-api
    app.kubernetes.io/part-of: fcapsule-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: inventory-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: inventory-api
        app.kubernetes.io/part-of: fcapsule-lab
        fcapsule.io/metrics: "true"
    spec:
      initContainers:
        - name: install-source
          image: python:3.12-slim
          command: ["python", "-m", "pip", "install", "--quiet", "--disable-pip-version-check", "--root-user-action=ignore", "--no-cache-dir", "--target", "/opt/lab", "https://github.com/Hi-io/fcapsule-lab/archive/refs/heads/main.zip"]
          volumeMounts:
            - name: source
              mountPath: /opt/lab
      containers:
        - name: inventory-api
          image: python:3.12-slim
          command: ["python", "-m", "app.mysql_inventory"]
          env:
            - name: PYTHONPATH
              value: /opt/lab
            - name: SERVICE_NAME
              value: inventory-api
            - name: PORT
              value: "8081"
          envFrom:
            - configMapRef:
                name: lab-mysql-config
            - secretRef:
                name: lab-mysql-credentials
          ports:
            - name: metrics
              containerPort: 8081
          readinessProbe:
            httpGet:
              path: /health
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 5
          startupProbe:
            httpGet:
              path: /health
              port: metrics
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /health
              port: metrics
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 80Mi
            limits:
              cpu: 400m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: source
              mountPath: /opt/lab
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: source
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-api
  namespace: fcapsule-lab
  labels:
    app.kubernetes.io/name: inventory-api
spec:
  selector:
    app.kubernetes.io/name: inventory-api
  ports:
    - name: http
      port: 8081
      targetPort: metrics
---
