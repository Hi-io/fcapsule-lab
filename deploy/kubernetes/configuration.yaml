apiVersion: v1
kind: Secret
metadata:
  name: lab-mysql-credentials
  namespace: fcapsule-lab
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: root-lab-only
  MYSQL_DATABASE: inventory
  MYSQL_USER: inventory
  MYSQL_PASSWORD: inventory-lab
  exporter.my.cnf: |
    [client]
    user=exporter
    password=exporter-lab
    host=mysql
    port=3306
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: lab-mysql-config
  namespace: fcapsule-lab
data:
  MYSQL_HOST: mysql
  MYSQL_MAX_CONNECTIONS: "40"
  LOG_NAMESPACE: fcapsule-lab
  LOG_CLUSTER: go15
  lab.cnf: |
    [mysqld]
    max_connections=40
    performance_schema=ON
    innodb_buffer_pool_size=128M
    slow_query_log=ON
    long_query_time=0.75
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: lab-mysql-init
  namespace: fcapsule-lab
data:
  00-inventory.sql: |
    CREATE TABLE IF NOT EXISTS inventory_items (
      sku VARCHAR(64) PRIMARY KEY,
      quantity INT NOT NULL
    ) ENGINE=InnoDB;
    CREATE TABLE IF NOT EXISTS reservation_events (
      token VARCHAR(64) PRIMARY KEY,
      order_id VARCHAR(64) NOT NULL,
      created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
      KEY idx_reservation_events_created_at (created_at)
    ) ENGINE=InnoDB;
    CREATE TABLE IF NOT EXISTS inventory_reconciliation_audit (
      id BIGINT AUTO_INCREMENT PRIMARY KEY,
      pair_id VARCHAR(36) NOT NULL,
      sku VARCHAR(64) NOT NULL,
      observed_quantity INT NOT NULL,
      created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
      KEY idx_reconciliation_created_at (created_at)
    ) ENGINE=InnoDB;
    INSERT INTO inventory_items (sku, quantity) VALUES ('sku-red-widget', 1000000)
      ON DUPLICATE KEY UPDATE quantity=quantity;
    INSERT INTO inventory_items (sku, quantity) VALUES ('sku-blue-widget', 1000000)
      ON DUPLICATE KEY UPDATE quantity=quantity;
  01-exporter.sql: |
    CREATE USER IF NOT EXISTS 'exporter'@'%' IDENTIFIED BY 'exporter-lab' WITH MAX_USER_CONNECTIONS 3;
    GRANT PROCESS, REPLICATION CLIENT, SELECT ON *.* TO 'exporter'@'%';
    FLUSH PRIVILEGES;
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: lab-scenario-config
  namespace: fcapsule-lab
data:
  INVENTORY_URL: http://inventory-api:8081
  INVENTORY_TIMEOUT_SECONDS: "1.5"
  MAX_RETRIES: "3"
  ORDER_SIGNING_KEY_ID: checkout-key-v1
  INVENTORY_ACCEPTED_KEY_ID: checkout-key-v1
  ORDER_EXPECTED_SCHEMA: v1
  INVENTORY_RESPONSE_SCHEMA: v1
  INVENTORY_QUERY_REVISION: v1
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: lab-runtime
  namespace: fcapsule-lab
data:
  INVENTORY_URL: http://inventory-api:8081
  WORKER_URL: http://lab-worker:8083
  ORDERS_URL: http://orders-api:8080
  REQUESTS_PER_SECOND: "25"
  MAX_INFLIGHT: "12"
  INVENTORY_TIMEOUT_SECONDS: "1.5"
  MAX_RETRIES: "3"
  LOG_NAMESPACE: fcapsule-lab
  LOG_CLUSTER: go15
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: lab-control
  namespace: fcapsule-lab
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: lab-scenario-config-writer
  namespace: fcapsule-lab
rules:
  - apiGroups: [""]
    resources: ["configmaps", "services"]
    resourceNames: ["lab-scenario-config", "lab-app-metrics"]
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: lab-control-scenario-config
  namespace: fcapsule-lab
subjects:
  - kind: ServiceAccount
    name: lab-control
    namespace: fcapsule-lab
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: lab-scenario-config-writer
