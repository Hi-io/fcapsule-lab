apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab-incident-library
  namespace: fcapsule-lab
  labels:
    app.kubernetes.io/name: lab-incident-library
    app.kubernetes.io/part-of: fcapsule-lab
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: lab-incident-library
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lab-incident-library
        app.kubernetes.io/part-of: fcapsule-lab
        fcapsule.io/metrics: "true"
    spec:
      initContainers:
        - name: install-source
          image: python:3.12-slim
          command: ["python", "-m", "pip", "install", "--quiet", "--disable-pip-version-check", "--root-user-action=ignore", "--no-cache-dir", "--target", "/opt/lab", "https://github.com/Hi-io/fcapsule-lab/archive/refs/heads/main.zip"]
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 192Mi}
          volumeMounts:
            - name: source
              mountPath: /opt/lab
      containers:
        - name: lab-incident-library
          image: python:3.12-slim
          command: ["python", "-m", "app.library_runtime"]
          env:
            - name: PYTHONPATH
              value: /opt/lab
            - name: SERVICE_NAME
              value: lab-incident-library
            - name: PORT
              value: "8085"
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef: {fieldPath: metadata.namespace}
            - name: POD_NAME
              valueFrom:
                fieldRef: {fieldPath: metadata.name}
          ports:
            - name: metrics
              containerPort: 8085
          readinessProbe:
            httpGet: {path: /health, port: metrics}
            periodSeconds: 5
          resources:
            requests: {cpu: 25m, memory: 48Mi}
            limits: {cpu: 400m, memory: 192Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - name: source
              mountPath: /opt/lab
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: source
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: lab-incident-library
  namespace: fcapsule-lab
  labels:
    app.kubernetes.io/name: lab-incident-library
    fcapsule.io/app-metrics: "true"
spec:
  selector:
    app.kubernetes.io/name: lab-incident-library
  ports:
    - name: metrics
      port: 8085
      targetPort: metrics
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: fcapsule-lab-incident-library
  namespace: fcapsule-lab
  labels:
    release: prometheus
    app.kubernetes.io/part-of: fcapsule-lab
spec:
  groups:
    - name: fcapsule-lab.incident-library
      rules:
        - alert: LabLibraryOperationFailures
          expr: |
            max by (namespace, pod, service, scenario_id) (
              increase(lab_library_failures_total{namespace="fcapsule-lab",service="lab-incident-library"}[1m])
            ) > 3
            and on (namespace, pod, scenario_id)
              max by (namespace, pod, service, scenario_id) (
                lab_library_active{namespace="fcapsule-lab",service="lab-incident-library"}
              ) == 1
          for: 10s
          labels:
            severity: warning
            signal_class: FM
          annotations:
            summary: The active incident-library workload has repeated operation failures.
            description: Repeated application operations failed. Inspect the service logs and scenario ID for context.
