apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: fcapsule-lab-applications
  namespace: fcapsule-lab
  labels:
    release: prometheus
    app.kubernetes.io/part-of: fcapsule-lab
spec:
  selector:
    matchLabels:
      fcapsule.io/app-metrics: "true"
  endpoints:
    - port: metrics
      path: /metrics
      interval: 10s
      scrapeTimeout: 5s
      relabelings:
        - sourceLabels: [__meta_kubernetes_namespace]
          targetLabel: namespace
        - sourceLabels: [__meta_kubernetes_pod_name]
          targetLabel: pod
        - sourceLabels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
          targetLabel: service
        - sourceLabels: [__meta_kubernetes_pod_label_cnfc_id]
          targetLabel: cnfc
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: fcapsule-lab-mysql
  namespace: fcapsule-lab
  labels:
    release: prometheus
    app.kubernetes.io/part-of: fcapsule-lab
spec:
  selector:
    matchLabels:
      fcapsule.io/mysql-metrics: "true"
  endpoints:
    - port: metrics
      path: /metrics
      interval: 15s
      scrapeTimeout: 8s
      relabelings:
        - sourceLabels: [__meta_kubernetes_namespace]
          targetLabel: namespace
        - sourceLabels: [__meta_kubernetes_pod_name]
          targetLabel: pod
        - targetLabel: service
          replacement: mysql-exporter
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: fcapsule-lab-incidents
  namespace: fcapsule-lab
  labels:
    release: prometheus
    app.kubernetes.io/part-of: fcapsule-lab
spec:
  groups:
    - name: fcapsule-lab.fault-management
      rules:
        - alert: LabCNFCInventoryRouteFailures
          expr: |
            sum by (namespace, cnfc) (
              max by (namespace, cnfc, pod) (
                increase(lab_cnfc_edge_dependency_failures_total{
                  namespace="fcapsule-lab", cnfc!=""
                }[1m])
              )
            ) > 8
          for: 15s
          labels:
            severity: warning
            signal_class: CM
          annotations:
            summary: Inventory dependency probes are failing within a checkout CNFC.
            description: Failure counts rose across this CNFC. Compare its replicas and their dependency route evidence before attributing the cause.

        - alert: LabWorkerOOMKilled
          expr: |
            (
              kube_pod_container_status_last_terminated_reason{
                namespace="fcapsule-lab", container="worker", reason="OOMKilled"
              } == 1
              and on(namespace, pod, container)
              (
                time() - kube_pod_container_status_last_terminated_timestamp{
                  namespace="fcapsule-lab", container="worker"
                } < 300
              )
            )
          for: 0m
          labels:
            severity: critical
            service: lab-worker
            signal_class: FM
          annotations:
            summary: Kubernetes reported a recent worker OOM termination.
            description: The worker's last termination reason is OOMKilled and its timestamp is recent. Investigate the captured memory history and active work.

        - alert: LabWorkerBufferPressure
          expr: max by (namespace, pod, service) (lab_worker_allocated_bytes{namespace="fcapsule-lab",service="lab-worker"}) > 83886080
          for: 15s
          labels:
            severity: warning
            service: lab-worker
            signal_class: PM
          annotations:
            summary: The worker's retained memory is above 80 MiB.
            description: The application memory gauge stayed above 80 MiB for 15 seconds. Compare its recent growth with the container memory limit and inspect the active work.

        - alert: LabWorkerCrashLooping
          expr: |
            max_over_time(kube_pod_container_status_waiting_reason{
              namespace="fcapsule-lab", container="worker", reason="CrashLoopBackOff"
            }[2m]) >= 1
          for: 20s
          labels:
            severity: critical
            service: lab-worker
            signal_class: FM
          annotations:
            summary: A worker container is in restart backoff.
            description: Kubernetes observed CrashLoopBackOff within the last two minutes. The cause is not established by this alert.

        - alert: LabWorkerPoisonRetries
          expr: increase(lab_worker_poison_retries_total{namespace="fcapsule-lab",service="lab-worker"}[1m]) > 2
          for: 10s
          labels:
            severity: critical
            service: lab-worker
            signal_class: FM
          annotations:
            summary: The worker is repeatedly rejecting imported documents.
            description: More than two import deliveries were rejected and left unacknowledged in the last minute. Inspect the retained job and decoder evidence.

        - alert: LabOrdersDependencyDocumentInvalid
          expr: increase(orders_dependency_failures_total{namespace="fcapsule-lab",kind="contract_shape"}[1m]) > 5
          for: 15s
          labels:
            severity: critical
            service: orders-api
            signal_class: FM
          annotations:
            summary: Checkout is rejecting inventory response documents.
            description: More than five dependency responses failed checkout validation within one minute. Inspect the response evidence and runtime contracts.

        - alert: LabInventoryConstraintFailures
          expr: increase(inventory_transaction_failures_total{namespace="fcapsule-lab",kind="constraint"}[1m]) > 5
          for: 15s
          labels:
            severity: critical
            service: inventory-api
            signal_class: FM
          annotations:
            summary: Inventory reservation transactions are violating a database constraint.
            description: More than five reservation transactions were rejected by a database constraint within one minute.

        - alert: LabInventoryDeadlockVictims
          expr: increase(inventory_transaction_failures_total{namespace="fcapsule-lab",kind="deadlock"}[1m]) > 3
          for: 15s
          labels:
            severity: warning
            service: inventory-api
            signal_class: FM
          annotations:
            summary: Inventory reconciliation transactions are being rolled back.
            description: The database selected more than three inventory transactions as deadlock victims within one minute.

        - alert: LabOrdersIdempotencyConflicts
          expr: increase(orders_internal_failures_total{namespace="fcapsule-lab",kind="idempotency_conflict"}[1m]) > 5
          for: 15s
          labels:
            severity: critical
            service: orders-api
            signal_class: FM
          annotations:
            summary: Checkout requests are conflicting with existing idempotency records.
            description: More than five request conflicts were recorded within one minute. Inspect request identities and payload evidence.

    - name: fcapsule-lab.performance-management
      rules:
        - alert: LabWorkerCPUHigh
          expr: |
            sum by (namespace, pod, container) (
              rate(container_cpu_usage_seconds_total{
                namespace="fcapsule-lab", container="worker", image!=""
              }[1m])
            )
            /
            max by (namespace, pod, container) (
              kube_pod_container_resource_limits{
                namespace="fcapsule-lab", container="worker", resource="cpu", unit="core"
              }
            ) > 0.75
          for: 0s
          labels:
            severity: warning
            service: lab-worker
            signal_class: PM
          annotations:
            summary: The lab worker has consumed more than 75 percent of its CPU limit.
            description: The one-minute CPU rate is above 75 percent of the configured limit. Compare recent usage with worker activity and its resource limit.

        - alert: LabMySQLConnectionsSaturated
          expr: |
            (
              inventory_mysql_client_sessions_active{namespace="fcapsule-lab",service="inventory-api"}
              /
              clamp_min(inventory_mysql_server_max_connections{namespace="fcapsule-lab",service="inventory-api"}, 1)
            ) > 0.80
            and on(namespace,pod,service)
              (inventory_mysql_server_max_connections{namespace="fcapsule-lab",service="inventory-api"} > 0)
            and on(namespace,pod,service)
              (time() - inventory_mysql_sample_timestamp_seconds{namespace="fcapsule-lab",service="inventory-api"} < 45)
            and on(namespace,pod,service)
              (time() - timestamp(inventory_mysql_client_sessions_active{namespace="fcapsule-lab",service="inventory-api"}) < 30)
            and on(namespace,pod,service)
              (up{namespace="fcapsule-lab",service="inventory-api"} == 1)
          for: 20s
          labels:
            severity: critical
            service: inventory-api
            signal_class: PM
          annotations:
            summary: Inventory-owned MySQL sessions are above 80 percent of the observed server capacity.
            description: Compare the inventory process's checked-out sessions with the fresh MySQL capacity sample and independent exporter before changing connection limits.

        - alert: LabInventoryLockContention
          expr: increase(inventory_database_failures_total{namespace="fcapsule-lab",kind="lock_timeout"}[2m]) > 5
          for: 15s
          labels:
            severity: warning
            service: inventory-api
            signal_class: PM
          annotations:
            summary: Inventory transactions are timing out on an InnoDB row lock.
            description: More than five lock-wait timeouts were recorded within two minutes. The blocker must be investigated separately.

        - alert: LabInventoryAdmissionRejections
          expr: increase(inventory_reservation_admission_rejections_total{namespace="fcapsule-lab",service="inventory-api"}[1m]) > 5
          for: 15s
          labels:
            severity: warning
            service: inventory-api
            signal_class: PM
          annotations:
            summary: Inventory is shedding reservation attempts before opening MySQL sessions.
            description: More than five reservation attempts were rejected by the local admission limit within one minute. Check checkout failures and the database operation holding the admitted slot.

        - alert: LabInventoryQueryFailures
          expr: increase(inventory_database_failures_total{namespace="fcapsule-lab",kind="query"}[1m]) > 5
          for: 15s
          labels:
            severity: critical
            service: inventory-api
            signal_class: FM
          annotations:
            summary: Inventory database statements are failing.
            description: More than five database query failures were recorded within one minute. Inspect returned error codes and the deployed query contract.

        - alert: LabInventoryConnectionFailures
          expr: increase(inventory_database_failures_total{namespace="fcapsule-lab",kind="connection"}[1m]) > 5
          for: 15s
          labels:
            severity: warning
            service: inventory-api
            signal_class: FM
          annotations:
            summary: Inventory cannot acquire database sessions reliably.
            description: More than five connection failures were recorded within one minute. This can indicate capacity, reachability or authentication problems.

        - alert: LabCheckoutFailureRateHigh
          expr: |
            sum by (namespace, pod) (rate(orders_checkout_requests_total{namespace="fcapsule-lab",status="503"}[1m]))
            /
            clamp_min(sum by (namespace, pod) (rate(orders_checkout_requests_total{namespace="fcapsule-lab"}[1m])), 0.01) > 0.15
          for: 20s
          labels:
            severity: critical
            service: orders-api
            signal_class: PM
          annotations:
            summary: More than 15 percent of checkout requests are failing.
            description: The observed checkout failure ratio is elevated. Check the scoped request and dependency evidence to identify where requests are rejected.

        - alert: LabCheckoutLatencyHigh
          expr: |
            (
              orders_checkout_latency_p95_seconds{namespace="fcapsule-lab",service="orders-api"} > 0.25
            )
            and on(namespace,pod,service)
              (orders_checkout_latency_sample_count{namespace="fcapsule-lab",service="orders-api"} >= 10)
            and on(namespace,pod,service)
              (time() - orders_checkout_latency_latest_sample_timestamp_seconds{namespace="fcapsule-lab",service="orders-api"} < 30)
            and on(namespace,pod,service)
              (up{namespace="fcapsule-lab",service="orders-api"} == 1)
          for: 20s
          labels:
            severity: warning
            service: orders-api
            signal_class: PM
          annotations:
            summary: Checkout p95 latency is above 250 milliseconds.
            description: The local checkout observation window has remained above the latency threshold for twenty seconds.

        - alert: LabInventoryDependencyLatencyHigh
          expr: |
            (
              orders_inventory_dependency_latency_p95_seconds{namespace="fcapsule-lab",service="orders-api"} > 0.25
            )
            and on(namespace,pod,service)
              (orders_inventory_dependency_latency_sample_count{namespace="fcapsule-lab",service="orders-api"} >= 10)
            and on(namespace,pod,service)
              (time() - orders_inventory_dependency_latency_latest_sample_timestamp_seconds{namespace="fcapsule-lab",service="orders-api"} < 30)
            and on(namespace,pod,service)
              (up{namespace="fcapsule-lab",service="orders-api"} == 1)
          for: 20s
          labels:
            severity: warning
            service: orders-api
            signal_class: PM
          annotations:
            summary: Orders-to-Inventory attempt p95 latency is above 250 milliseconds.
            description: At least ten recent inventory attempts have remained above the latency threshold for twenty seconds.

        - alert: LabOrdersDependencyTransportFailures
          expr: increase(orders_dependency_failures_total{namespace="fcapsule-lab",kind="transport"}[1m]) > 5
          for: 15s
          labels:
            severity: critical
            service: orders-api
            signal_class: CM
          annotations:
            summary: Checkout cannot establish inventory dependency requests.
            description: More than five dependency transport attempts failed within one minute. Inspect endpoint and service discovery evidence.

        - alert: LabOrdersDependencyTimeouts
          expr: increase(orders_dependency_failures_total{namespace="fcapsule-lab",kind="timeout"}[1m]) > 5
          for: 15s
          labels:
            severity: critical
            service: orders-api
            signal_class: CM
          annotations:
            summary: Checkout inventory calls are exceeding their timeout.
            description: More than five dependency calls exceeded the caller timeout within one minute.

        - alert: LabOrdersDependencyAuthorizationFailures
          expr: increase(orders_dependency_failures_total{namespace="fcapsule-lab",kind="authorization"}[1m]) > 5
          for: 15s
          labels:
            severity: critical
            service: orders-api
            signal_class: CM
          annotations:
            summary: Inventory is rejecting checkout request authorization.
            description: More than five inventory calls returned an authorization failure within one minute. Inspect both sides of the active request contract.

        - alert: LabOrdersDependencySchemaRejected
          expr: increase(orders_dependency_failures_total{namespace="fcapsule-lab",kind="contract_version"}[1m]) > 5
          for: 15s
          labels:
            severity: critical
            service: orders-api
            signal_class: CM
          annotations:
            summary: Checkout is rejecting the inventory response schema version.
            description: More than five dependency documents used a version that did not satisfy the active consumer contract.

    - name: fcapsule-lab.monitoring-discovery
      rules:
        - alert: LabExporterTargetUnavailable
          expr: up{namespace="fcapsule-lab",service="mysql-exporter"} == 0
          for: 15s
          labels:
            severity: warning
            signal_class: discovery
            target_service: mysql-exporter
            target_workload: mysql-exporter
          annotations:
            summary: The exporter metrics target is unavailable.
            description: Prometheus cannot collect metrics from a discovered exporter. Check monitoring and workload health independently.
        - alert: LabApplicationMetricsDiscoveryMissing
          expr: |
            absent_over_time(up{namespace="fcapsule-lab",service="orders-api"}[1m])
            and on(namespace)
              (kube_deployment_status_replicas_available{
                namespace="fcapsule-lab",deployment="orders-api"
              } > 0)
          for: 30s
          labels:
            severity: warning
            service: orders-api
            target_service: lab-app-metrics
            target_workload: orders-api
            signal_class: discovery
          annotations:
            summary: Application metrics are no longer being discovered.
            description: The orders deployment has available replicas but its metrics target has not been scraped recently. Inspect target discovery and monitoring selectors before assuming the workload failed.
