global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: orders-api
    static_configs:
      - targets: ["orders-api:8080"]

  - job_name: inventory-api
    static_configs:
      - targets: ["inventory-api:8081"]

  - job_name: traffic-generator
    static_configs:
      - targets: ["traffic-generator:8082"]
